hypotheses:
  H1:
    label: "Triton VP-FA full prefill removes eager attention from VisiPruner prefill"
    description: "使用 Triton causal prefill + last-query proxy 后，full VP-FA prefill 不再依赖完整 eager QK^T/softmax/AV 主路径，也不依赖 patched FA2 extension"
    status: supported_by_20260702_layer_profile
    priority: P0
  H2:
    label: "Token pruning 在 FA2 backend 上仍有加速效果"
    description: "Middle/deep pruning 物理移除 token 后，后续层处理更短序列；单请求端到端收益仍需 decode kernel/launch 优化配合"
    status: not_supported_by_20260703_32tok_same_input_single_request
    priority: P0
  H3:
    label: "Triton shallow in-kernel edits preserve official VisiPruner semantics"
    description: "Shallow pruning 的 post-softmax weight edits 在 Triton prefill kernel 内实现，应与 eager reference 数值对齐"
    status: in_progress
    priority: P1

