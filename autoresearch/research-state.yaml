# VisiPruner Triton VP-FA Inference — Research State
# Updated 2026-06-17: Cancelled unfair eager-vs-FA2 comparison.
# Updated 2026-07-01: Cancelled patched FlashAttention VP-FA source/build plan.
# Updated 2026-07-02: Completed Triton VP-FA single-request clock/Nsight layer profile.
# Updated 2026-07-03: Completed same-input three-way layer retest; audit ok=true.
# Current direction: full VP-FA prefill uses Triton kernels, not flash_attn_2_cuda.vp_fwd.

project: VisiPruner Triton VP-FA
question: "VisiPruner 的 token pruning 能否通过高效 attention/kernel backend 实现真正的墙钟加速？"

methodology:
  tier1: "nsys (sampling, non-invasive) → full GPU timeline → locate hottest kernels"
  tier2: "ncu (replay, deep counters) → targeted analysis on hotspots identified by nsys"
  forbidden: ["Python wall-time (time.time/CUDATimer/torch.cuda.Event)", "CUPTI (torch.profiler)"]
  adopted: "2026-06-16 — nsys→ncu two-tier method"
  revision: "2026-07-01 — VP-FA full prefill uses Triton kernels; source-level patched FlashAttention build and flash_attn_2_cuda.vp_fwd path are cancelled"

current_direction:
  backend_name: visipruner-full-vp-fa
  implementation: "Triton VP-FA prefill inside copied optimized VisiPruner modeling"
  active_code:
    - repo/llava/model/language_model/vp_flash_attention.py
    - repo/llava/model/language_model/custom_modeling_llama_decode_optimized.py
    - repo/llava/model/language_model/decode_optimization.py
  cancelled:
    - "source-level patched FlashAttention build"
    - "flash_attn_2_cuda.vp_fwd runtime dependency"
    - "third_party/flash-attention-v2.8.3.post1-vpfa as active experiment path"
  scope:
    prefill: "Triton causal attention for shallow/middle/deep; shallow applies VisiPruner edits in-kernel"
    selection_proxy: "Triton last-query weights/output where shape allows; torch reference fallback for unsupported masks/shapes"
    decode: "not solved by current prefill cleanup; E3 covers single-request decode kernels"

key_insight: |
  value_aware_token_selection() only needs attn_weights[:, :, -1, :] — the LAST
  query token's attention weights. This is O(L×d) to compute, NOT O(L²×d).
  Therefore the optimized path should keep full prefill attention inside a
  fused kernel and compute only the last-query proxy for pruning decisions.
  The current experiment implements this with Triton rather than a patched FA2
  extension. Never materialize full S=QK^T for the pruning proxy.

